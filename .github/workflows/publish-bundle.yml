name: publish-bundle
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version (e.g., 0.3.0)"
        required: true
        type: string
      artifact_name:
        description: "Artifact name for bundle"
        required: false
        default: "release_bundle"
        type: string
      make_release:
        description: "Also create GitHub Release and upload asset"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      tag:
        description: "Release tag (default: v<version>)"
        required: false
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Install deps
        run: pip install pyyaml
      - name: Verify packer & manifest
        run: |
          test -f pack_release.py || (echo "::error::pack_release.py missing at repo root" && exit 1)
          test -f install_manifest.yaml || (echo "::error::install_manifest.yaml missing at repo root" && exit 1)
      - name: Build bundle
        id: build
        run: |
          set -e
          OUT=$(python pack_release.py --version "${{ inputs.version }}" --out dist --name "${{ inputs.artifact_name }}")
          echo "zip_path=$OUT" >> $GITHUB_OUTPUT
      - name: Checksum
        id: sum
        run: |
          shasum -a 256 "${{ steps.build.outputs.zip_path }}" > "${{ steps.build.outputs.zip_path }}.sha256"
          echo "sha_path=${{ steps.build.outputs.zip_path }}.sha256" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ steps.build.outputs.zip_path }}
            ${{ steps.sum.outputs.sha_path }}
      - name: Create GitHub Release
        if: ${{ inputs.make_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || format('v{0}', inputs.version) }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.zip_path }}
            ${{ steps.sum.outputs.sha_path }}
